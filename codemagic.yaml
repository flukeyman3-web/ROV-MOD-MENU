workflows:
  ios-workflow:
    name: ROV MOD MENU iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      
name: Install XcodeGen
      script: brew install xcodegen

      
name: Generate Xcode project
      script: xcodegen generate

      
name: Build iOS archive
      script: |
        xcodebuild \-project ROV_MOD_MENU.xcodeproj \-scheme ROV_MOD_MENU \-sdk iphoneos \-configuration Release \-archivePath build/ROV_MOD_MENU.xcarchive \
          archive CODE_SIGNING_ALLOWED=NO

    artifacts:
      
build/ROV_MOD_MENU.xcarchive
